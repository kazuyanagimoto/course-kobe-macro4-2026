name: Render and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing writes the rendered site to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Julia chunks are never executed here: every chapter ships with a
      # frozen result in _freeze/, so the runner needs Quarto and fonts only.
      - name: Install fonts
        run: .github/scripts/install-fonts.sh

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render book
        run: quarto render

      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
