project:
  type: book
  execute-dir: file
  resources:
    # 課題は問題PDFだけをサイトに配信する (解答PDFは含めない).
    - assignment/**/*-exercise.pdf
    - static/img/social-card.png

book:
  title: Family Macroeconomics
  search: false
  author:
    - name: Kazuharu Yanagimoto
      email: yanagimoto@econ.kobe-u.ac.jp
      orcid: 0009-0007-1967-8304
      affiliations:
      - name: Kobe University
  date: 2026-10-01
  downloads: [pdf]
  site-url: https://kazuyanagimoto.com/course-kobe-macro4-2026
  repo-url: https://github.com/kazuyanagimoto/course-kobe-macro4-2026
  favicon: static/img/logo.drawio.svg
  open-graph:
    image: static/img/social-card.png
    description: 結婚・出生・家計内配分のマクロ経済学
  twitter-card:
    card-style: summary_large_image
    image: static/img/social-card.png
    description: 結婚・出生・家計内配分のマクロ経済学
  sidebar:
    logo: static/img/logo.drawio.svg
  chapters:
    - index.qmd
    - part: 数値計算
      chapters:
        - lesson/numerical/nlopt.qmd
        - lesson/numerical/approx.qmd
        - lesson/numerical/dp.qmd
        - lesson/numerical/gmm.qmd
    - part: lesson/marriage/index.qmd
      chapters:
        - lesson/marriage/allocation.qmd
        - lesson/marriage/search.qmd
        - lesson/marriage/matching.qmd
        - lesson/marriage/frictionless.qmd
        - lesson/marriage/fertility.qmd
  appendices:
    - lesson/appendix/proof.qmd
    - lesson/appendix/continuous-time.qmd
    - references.qmd

website:
  llms-txt: true

bibliography: references.bib

filters:
  # @sec-x as 第7章 / 7.1節 / 付録B instead of Chapter 7 / Section 7.1.
  - static/filters/sec-ref-ja.lua
  # Typst only: Observable JS cells need a browser, so the PDF leaves them out.
  - static/filters/ojs-html-only.lua
  # HTML only: a theorem label with nothing after it gets a paragraph of its
  # own, so that the label line styled in styles.css leaves no empty line.
  - path: static/filters/theorem-label.lua
    at: post-render

number-depth: 3

format:
  html:
    code-tools: true
    theme:
      - cosmo
      - brand
    highlight-style: atom-one
    css: styles.css
    lightbox: true
  jsbook-typst:
    CJKmainfont: Noto Serif CJK JP
    CJKsansfont: Noto Sans CJK JP
    codefont: JuliaMono
    linkcolor: "#0F6A81"
    citecolor: "#0F6A81"
    # Use citeproc so the bibliography lands in the #refs div of references.qmd
    # instead of Typst's native #bibliography (which would duplicate the heading).
    citeproc: true
    # Source cells are shown on the website but hidden in the PDF.
    execute:
      echo: false

execute:
  freeze: auto

crossref:
  fig-title: "図"
  fig-prefix: "図"
  tbl-title: "表"
  tbl-prefix: "表"
  eq-title: "式"
  eq-prefix: "式"
  def-title: "定義"
  def-prefix: "定義"
  thm-title: "定理"
  thm-prefix: "定理"
  prp-title: "命題"
  prp-prefix: "命題"
  lem-title: "補題"
  lem-prefix: "補題"
  exm-title: "例"
  exm-prefix: "例"
  cor-title: "系"
  cor-prefix: "系"

# Titles that crossref: does not take. The website is not `lang: ja`, so
# the proof and remark labels would otherwise be in English.
language:
  crossref-alg-title: "アルゴリズム"
  crossref-alg-prefix: "アルゴリズム"
  environment-proof-title: "証明"
  environment-remark-title: "注意"
